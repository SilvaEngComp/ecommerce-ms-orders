spring:
  application:
    name: orders
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5555/ecommerceorders
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    online.eliabe.ecommerce.orders: DEBUG
    online.eliabe.ecommerce.orders.infrastructore.acpects: DEBUG
    org.springframework: WARN
    org.springframework.boot: INFO
  file:
    name: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8083

ecommerce:
  orders:
    clients:
      products:
        url: 'http://localhost:8081/products'
      clients:
        url:  'http://localhost:8082/clients'
  config:
    kafka:
      server-url: 'http://localhost:29092'
      topics:
        payed-orders: 'ecommerce.payed-orders'
        payed-requested: 'ecommerce.requested-orders'
        payed-sent: 'ecommerce.sent-orders'
